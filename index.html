<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR-код для переказу (НБУ)</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
<div class="bg-white p-8 rounded-lg shadow-lg w-full max-w-md">
    <form onsubmit="return false">
        <h1 class="text-2xl font-bold mb-4 text-center">QR-код для переказу</h1>
        <div class="mb-4">
            <label for="account" class="block text-gray-700">IBAN</label>
            <input type="text" id="account" placeholder="UA..." maxlength="29"
                   class="w-full p-2 border border-gray-300 rounded mt-1" required>
        </div>
        <div class="mb-4">
            <label for="edrpo" class="block text-gray-700">ЄДРПОУ / РНОКПП</label>
            <input type="text" id="edrpo" placeholder="Код отримувача" maxlength="10"
                   class="w-full p-2 border border-gray-300 rounded mt-1" required>
        </div>
        <div class="mb-4">
            <label for="recipient" class="block text-gray-700">Отримувач</label>
            <input type="text" id="recipient" placeholder="ПІБ або назва організації" maxlength="140"
                   class="w-full p-2 border border-gray-300 rounded mt-1" required>
        </div>
        <div class="mb-4">
            <label for="amount" class="block text-gray-700">Сума (UAH)</label>
            <input type="number" min="0.01" step="0.01" max="999999999.99" id="amount" placeholder="0.01"
                   class="w-full p-2 border border-gray-300 rounded mt-1" required>
        </div>
        <div class="mb-4">
            <label for="purpose" class="block text-gray-700">Призначення платежу</label>
            <textarea id="purpose" placeholder="Призначення платежу"
                      class="w-full p-2 border border-gray-300 rounded mt-1"
                      maxlength="420" rows="3" required></textarea>
        </div>
        <div id="qrcode" class="mt-8 flex justify-center"></div>
        <p id="byte-count" class="mt-2 text-gray-500 text-xs text-center hidden"></p>
    </form>
    <p class="mt-6 text-gray-400 text-xs text-center">
        Версія формату 002 —
        <a href="https://zakon.rada.gov.ua/laws/show/v0097500-25#n16" target="_blank" rel="noopener"
           class="underline hover:text-gray-600">Постанова НБУ № 97 від 19.08.2025</a>
    </p>
    <p class="mt-2 text-gray-400 text-xs text-center">
        Ця сторінка не пов'язана з жодним банком, Національним банком України чи платіжною системою
        і не здійснює переказів — вона лише формує QR-код за відкритим стандартом.
    </p>
</div>
<script src="./qrcode.bundle.js"></script>
<script>
    const paramToId = {
        iban:      'account',
        edrpo:     'edrpo',
        recipient: 'recipient',
        amount:    'amount',
        purpose:   'purpose',
    };

    function showQRError(msg) {
        const container = document.getElementById('qrcode');
        container.innerHTML = `<p class="text-red-600 text-sm text-center">${msg}</p>`;
        document.getElementById('byte-count').classList.add('hidden');
    }

    function syncParamsToURL() {
        const params = new URLSearchParams();
        for (const [param, id] of Object.entries(paramToId)) {
            const value = document.getElementById(id).value;
            if (value) params.set(param, value);
        }
        const query = params.toString();
        history.replaceState(null, '', query ? '?' + query : window.location.pathname);
    }

    function generateQRCode() {
        const account   = document.getElementById('account').value.trim();
        const edrpo     = document.getElementById('edrpo').value.trim();
        const recipient = document.getElementById('recipient').value.trim();
        const amount    = document.getElementById('amount').value;
        const purpose   = document.getElementById('purpose').value.trim();

        // Don't render until all fields have values
        if (!account || !edrpo || !recipient || !amount || !purpose) {
            document.getElementById('qrcode').innerHTML = '';
            document.getElementById('byte-count').classList.add('hidden');
            return;
        }

        // Постанова НБУ №97 від 19.08.2025, додаток 2: рахунок — рівно 29 символів
        if (account.length !== 29) {
            showQRError('IBAN має містити рівно 29 символів.');
            return;
        }

        // Ціла сума — без крапки ("UAH3"), з копійками — рівно два знаки ("UAH576.40")
        const num = parseFloat(amount);
        if (!(num > 0) || num > 999999999.99) {
            showQRError('Сума має бути від 0.01 до 999999999.99.');
            return;
        }
        const formattedAmount = Number.isInteger(num) ? String(num) : num.toFixed(2);

        // Відкрита структура даних QR, версія формату 002 (Постанова НБУ №97,
        // додаток 3, таблиця 2) — 13 полів, кожне завершується \n (LF):
        // BCD / версія / кодування (1 = UTF-8) / функція UCT / BIC(порожнє) /
        // отримувач / рахунок / UAH{сума} / код отримувача / ціль(порожнє) /
        // reference(порожнє) / призначення / дисплей(порожнє)
        const dataStr = [
            'BCD', '002', '1', 'UCT', '',
            recipient, account, `UAH${formattedAmount}`,
            edrpo, '', '', purpose, ''
        ].join('\n') + '\n';

        // Структура даних QR — гіперпосилання: код старту застосунку +
        // Base64URL(відкрита структура). Закодована частина ≤ 475 байтів.
        const bytes = new TextEncoder().encode(dataStr);
        const binStr = Array.from(bytes, b => String.fromCharCode(b)).join('');
        const b64url = btoa(binStr).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');

        if (b64url.length > 475) {
            showQRError(`Дані перевищують ліміт (${b64url.length} / 475 байт). Скоротіть призначення платежу.`);
            return;
        }

        const qrText = 'https://bank.gov.ua/qr/' + b64url;

        const container = document.getElementById('qrcode');
        container.innerHTML = '';

        const canvas = document.createElement('canvas');
        container.appendChild(canvas);

        // Версія QR 10–17, корекція помилок "M" ("L" заборонено, бо знак гривні
        // для формату 002 обов'язковий — додаток 1, п. 13)
        let version;
        try {
            version = Math.max(10, QRCode.create(qrText, { errorCorrectionLevel: 'M' }).version);
        } catch (e) {
            showQRError('Помилка генерації: ' + e.message);
            return;
        }

        QRCode.toCanvas(canvas, qrText, {
            errorCorrectionLevel: 'M',
            version: version,
            width: 256,
            margin: 2
        }, function(err) {
            if (err) {
                showQRError('Помилка генерації: ' + err.message);
                return;
            }
            drawHryvniaSign(canvas, version);
            const byteEl = document.getElementById('byte-count');
            byteEl.textContent = `Розмір закодованих даних: ${b64url.length} / 475 байт`;
            byteEl.classList.remove('hidden');
        });
    }

    // Діаметр фонового кола в модулях залежно від версії QR (додаток 1, п. 11)
    const CIRCLE_MODULES = { 10: 17, 11: 19, 12: 19, 13: 21, 14: 23, 15: 23, 16: 25, 17: 25 };

    function drawHryvniaSign(canvas, version) {
        const moduleSize = canvas.width / (version * 4 + 17 + 4); // +4 — поле по 2 модулі з боків
        const r = CIRCLE_MODULES[version] * moduleSize / 2;
        const c = canvas.width / 2;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(c, c, r, 0, 2 * Math.PI);
        ctx.fill();
        ctx.fillStyle = '#000';
        // Знак вписано в коло, на 4 модулі менше від фонового (додаток 1, п. 12)
        ctx.font = 'bold ' + (2 * r - 4 * moduleSize) + 'px sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('₴', c, c);
    }

    document.addEventListener('DOMContentLoaded', function () {
        // Pre-fill from URL
        const params = new URLSearchParams(window.location.search);
        for (const [param, id] of Object.entries(paramToId)) {
            const value = params.get(param);
            if (value !== null) document.getElementById(id).value = value;
        }

        // Re-generate QR and sync URL on every input change
        for (const id of Object.values(paramToId)) {
            document.getElementById(id).addEventListener('input', function () {
                syncParamsToURL();
                generateQRCode();
            });
        }

        // Generate on load if pre-filled from URL
        generateQRCode();
    });
</script>
</body>
</html>
